services:
  crosspoint-sync:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - crosspoint-data:/data
    environment:
      # Set to "true" on private instances once your accounts exist.
      REGISTRATION_DISABLED: "false"
      # Set Listen Address so the service is accessible from outside the container
      LISTEN_ADDRESS: "::"
    restart: unless-stopped

volumes:
  crosspoint-data:
