services:
  crosspoint-sync:
    image: ghcr.io/crosspoint-reader/crosspoint-sync:main
    ports:
      - "8080:8080"
    volumes:
      - crosspoint-data:/data
    environment:
      BASE_PATH: "${BASE_PATH:-}"
      # Set to "true" on private instances once your accounts exist.
      REGISTRATION_DISABLED: "false"
      # Set Listen Address so the service is accessible from outside the container
      LISTEN_ADDRESS: "::"
      # Enables linking services (Hardcover, Micro.blog, etc.). Generate once with
      # `openssl rand -hex 32` and never change it, or saved logins become unreadable.
      # TOKEN_ENC_KEY: ""
      # Word-level Audiobookshelf sync needs speech-to-text: a hosted key (used
      # automatically once set, and it charges per audiobook) or the local
      # aligner service below. To transcribe locally, uncomment this service's
      # ASR_PROVIDER/ASR_URL, the aligner service, and the aligner-models volume
      # at the bottom of this file.
      # GROQ_API_KEY: ""
      # ASR_PROVIDER: "local"
      # ASR_URL: "http://aligner:8080"
      # Behind an HTTPS reverse proxy: block direct access to port 8080,
      # then uncomment this. See README.md for Caddy setup.
      # TRUST_PROXY: "true"
    restart: unless-stopped

  # Optional local speech-to-text for word-level Audiobookshelf sync. To use it,
  # uncomment this service, ASR_PROVIDER/ASR_URL above, and the aligner-models
  # volume at the bottom: leaving ASR_PROVIDER unset lets a GROQ_API_KEY in the
  # environment win, and the audio goes to Groq instead of your machine.
  # CPU only, one book at a time, models cached in the aligner-models volume.
  # aligner:
  #   image: ghcr.io/crosspoint-reader/crosspoint-sync-aligner:main
  #   volumes:
  #     - aligner-models:/models
  #   environment:
  #     WHISPER_MODEL: "base"        # base/small/medium/large-v3: CPU speed vs accuracy
  #     WHISPER_COMPUTE_TYPE: "int8"
  #     WHISPER_LANGUAGE: ""         # empty detects the language
  #   restart: unless-stopped

volumes:
  crosspoint-data:
  # aligner-models:
