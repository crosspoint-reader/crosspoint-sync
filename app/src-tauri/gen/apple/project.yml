name: crosspoint-sync-app
options:
  bundleIdPrefix: com.crosspointreader.sync
  deploymentTarget:
    iOS: 16.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: CrossPoint Sync
      PRODUCT_BUNDLE_IDENTIFIER: com.crosspointreader.sync
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  crosspoint-sync-app_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Liquid Glass app icon (Icon Composer); actool also flattens it for iOS < 26.
      - path: AppIcon.icon
      # Static libs here are linked below, never bundled: App Store rejects a
      # stray libapp.a resource (ITMS-90171).
      - path: Externals
        excludes: ["**/*.a"]
      - path: crosspoint-sync-app_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: crosspoint-sync-app_iOS/Info.plist
      properties:
        CFBundleDocumentTypes:
        - CFBundleTypeName: Reader documents
          CFBundleTypeRole: Viewer
          LSHandlerRank: Alternate
          LSItemContentTypes:
          - org.idpf.epub-container
          - com.adobe.adept.acsm
          - net.daringfireball.markdown
          - public.plain-text
        UTImportedTypeDeclarations:
        - UTTypeIdentifier: org.idpf.epub-container
          UTTypeDescription: EPUB book
          UTTypeConformsTo:
          - public.data
          UTTypeTagSpecification:
            public.filename-extension: epub
            public.mime-type: application/epub+zip
        - UTTypeIdentifier: com.adobe.adept.acsm
          UTTypeDescription: Adobe Content Server Message
          UTTypeConformsTo:
          - public.xml
          UTTypeTagSpecification:
            public.filename-extension: acsm
            public.mime-type: application/vnd.adobe.adept+xml
        - UTTypeIdentifier: net.daringfireball.markdown
          UTTypeDescription: Markdown document
          UTTypeConformsTo:
          - public.plain-text
          UTTypeTagSpecification:
            public.filename-extension: md
            public.mime-type: text/markdown
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.2
        CFBundleVersion: "17"
        CFBundleURLTypes:
          - CFBundleURLName: Reading widgets
            CFBundleURLSchemes: [crosspointsync]
        # iOS 27 refuses to launch SDK-27 apps on the legacy app-delegate
        # lifecycle; tao (>= 0.37) switches to its scene delegate when this is set.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Save image: share cards and wallpapers go to Photos (add-only access).
        # The image picker (wallpapers) offers the camera; iOS kills the app without this.
        NSCameraUsageDescription: CrossPoint Sync uses the camera when you take a photo for a wallpaper.
        NSPhotoLibraryAddUsageDescription: CrossPoint Sync saves the images you create, like wallpapers and share cards, to your photo library.
        # Other saved files (clippings Markdown) show in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        # Sending to the reader over Wi-Fi (crosspoint.local).
        NSLocalNetworkUsageDescription: CrossPoint Sync sends books to your CrossPoint reader over your Wi-Fi.
        NSBonjourServices: [_http._tcp]
    entitlements:
      path: crosspoint-sync-app_iOS/crosspoint-sync-app_iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.crosspointreader.sync]
        # Universal links for connector sign-in callbacks (server serves the AASA file).
        com.apple.developer.associated-domains: ["applinks:sync.crosspointreader.com"]
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        # Sources/crosspoint-sync-app/WidgetReload.swift
        SWIFT_VERSION: "5.0"
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - target: CrossPointShare
        embed: true
        codeSign: true
      - target: CrossPointWidget
        embed: true
        codeSign: true
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: AppIntents.framework
      - sdk: WebKit.framework
      - sdk: WidgetKit.framework
    preBuildScripts:
      - script: cargo tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  # Home screen widget (WidgetKit). Reads what the app writes into the shared App Group.
  CrossPointWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CrossPointWidget
    info:
      path: CrossPointWidget/Info.plist
      properties:
        CFBundleDisplayName: CrossPoint Sync
        CFBundleShortVersionString: 0.1.2
        CFBundleVersion: "17"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # The widget fetches from the sync server itself; a self-hosted one on the LAN may be plain http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: CrossPointWidget/CrossPointWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.crosspointreader.sync]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crosspointreader.sync.widget
        DEVELOPMENT_TEAM: 96247QW4R8
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: CrossPointWidget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  # Incoming shares queue files in the App Group even with the app closed.
  CrossPointShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CrossPointShare
        excludes: [Info.plist, CrossPointShare.entitlements]
    info:
      path: CrossPointShare/Info.plist
      properties:
        CFBundleDisplayName: CrossPoint Sync
        CFBundleShortVersionString: 0.1.2
        CFBundleVersion: '17'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule: SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments,
              $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.idpf.epub-container"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.adept.acsm"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text").@count
              > 0).@count > 0
        UTImportedTypeDeclarations:
        - UTTypeIdentifier: org.idpf.epub-container
          UTTypeDescription: EPUB book
          UTTypeConformsTo:
          - public.data
          UTTypeTagSpecification:
            public.filename-extension: epub
            public.mime-type: application/epub+zip
        - UTTypeIdentifier: com.adobe.adept.acsm
          UTTypeDescription: Adobe Content Server Message
          UTTypeConformsTo:
          - public.xml
          UTTypeTagSpecification:
            public.filename-extension: acsm
            public.mime-type: application/vnd.adobe.adept+xml
        - UTTypeIdentifier: net.daringfireball.markdown
          UTTypeDescription: Markdown document
          UTTypeConformsTo:
          - public.plain-text
          UTTypeTagSpecification:
            public.filename-extension: md
            public.mime-type: text/markdown
    entitlements:
      path: CrossPointShare/CrossPointShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.crosspointreader.sync]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crosspointreader.sync.share
        DEVELOPMENT_TEAM: 96247QW4R8
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: CrossPointShare
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: true
    dependencies:
      - sdk: UIKit.framework
      - sdk: UniformTypeIdentifiers.framework
