[package]
name = "crosspoint-sync-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
tauri = { version = "2.6.2", features = [] }
tauri-plugin-http = "2"
# OPDS browsing, downloads and the EPUB image optimizer (ported from common-stacks).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "2.5"
quick-xml = "0.39"
base64 = "0.22"
sanitize-filename = "0.6"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
tokio = { version = "1", features = ["time"] }
tauri-plugin-opener = "2"
# https app links back from browser sign-in.
tauri-plugin-deep-link = "2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSData", "NSFileManager", "NSString", "NSURL"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIImage", "UIImagePickerController"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
