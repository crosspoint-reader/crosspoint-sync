<!doctype html>
<!-- One store image: a caption plus a real app screenshot in a device frame,
     optionally with a crop of that screenshot enlarged as a callout.
     make-assets.mjs opens this with ?spec={layout, dev, shot, cards, crop, kick, head, icon}.
     cards: {name: [screenshot, crop]}, standalone UI cards for the App Store header and search layouts. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Inter:wght@400;500&family=Lora:wght@600&display=block" rel="stylesheet">
<style>
* { margin:0; box-sizing:border-box }
html, body { width:100%; height:100% }
body { overflow:hidden; position:relative; font-family:Inter, sans-serif; --kick:#b3cfc2; --ink:#fff;
  background:radial-gradient(120% 80% at 50% 0%, #315243, #1a2c24) }
body.paper { --kick:#4a7a62; --ink:#1c1917; background:radial-gradient(120% 80% at 50% 100%, #e7efe9, #fafaf9) }
.cap { position:absolute; left:90px; right:90px; text-align:center }
.cap.left { text-align:left }
.kick { font-family:Caveat; font-size:var(--k,64px); color:var(--kick); transform:rotate(-1.5deg); display:inline-block }
.cap.left .kick { transform-origin:left }
h1 { font-family:Lora; font-weight:600; font-size:var(--h,76px); line-height:1.12; letter-spacing:-0.01em;
  margin-top:10px; color:var(--ink); text-wrap:balance }
.dev { position:absolute; border-radius:var(--r); padding:var(--p); background:#0d1612;
  box-shadow:0 40px 90px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.08) }
.scr { overflow:hidden; border-radius:calc(var(--r) - var(--p) + 4px) }
.scr img { display:block; width:100% }
.call { position:absolute; overflow:hidden; border-radius:36px; box-shadow:0 30px 70px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.06) }
.call img { position:absolute; max-width:none }
/* iPhone and iPad hardware, sized in points: --u is one device point in CSS px (set below). */
.ios { --U:var(--u); padding:calc(var(--U) * var(--bz)); border-radius:calc(var(--U) * var(--or)); background:#000;
  box-shadow:0 40px 90px rgba(0,0,0,.45), 0 0 0 calc(var(--U) * 2.5) #3a3a3c, 0 0 0 calc(var(--U) * 3.5) #1c1c1e }
.ios .scr { position:relative; border-radius:calc(var(--U) * var(--sr)) }
.iphone { --bz:10; --sr:62; --or:72 }
.ipad { --bz:28; --sr:18; --or:46 }
.duo { --bz:12; --sr:34; --or:44 }
.sbar { position:absolute; inset:0 0 auto; background:#fafaf9; display:grid; align-items:center; color:#000; font-weight:600; letter-spacing:-0.01em }
.iphone .sbar { height:calc(var(--U) * 59); grid-template-columns:1fr calc(var(--U) * 126) 1fr; justify-items:center; font-size:calc(var(--U) * 17) }
.ipad .sbar { height:calc(var(--U) * 24); grid-template-columns:auto 1fr auto; padding:0 calc(var(--U) * 22); font-size:calc(var(--U) * 13.5) }
.sbar .ic { display:flex; align-items:center; gap:0.35em }
.sbar svg { height:0.72em; width:auto; display:block }
.island { position:absolute; left:50%; top:calc(var(--U) * 11); width:calc(var(--U) * 126); height:calc(var(--U) * 37);
  transform:translateX(-50%); border-radius:calc(var(--U) * 19); background:#000 }
.home { position:absolute; left:50%; bottom:calc(var(--U) * 8); height:calc(var(--U) * 5); transform:translateX(-50%);
  border-radius:calc(var(--U) * 3); background:#000 }
.iphone .home { width:calc(var(--U) * 144) }
.ipad .home { width:calc(var(--U) * 320) }
.btn { position:absolute; background:#2c2c2e; border-radius:calc(var(--U) * 2) }
.cam { position:absolute; width:calc(var(--U) * 7); height:calc(var(--U) * 7); border-radius:50%; background:#1c1f24 }
.logo { position:absolute; width:var(--s); text-align:center; color:#dbe7e1; font-size:calc(var(--s) * .17); font-weight:500 }
.logo img { width:var(--s); height:var(--s); border-radius:22%; display:block; margin:0 auto calc(var(--s) * .12);
  box-shadow:0 18px 40px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.12) }
.lines { position:absolute; inset:0 }
.feature { position:absolute; left:72px; top:0; bottom:0; width:520px; display:flex; flex-direction:column; justify-content:center; color:#fff }
.feature img { width:84px; height:84px; border-radius:20px; box-shadow:0 0 0 1px rgba(255,255,255,.2) }
.feature p { margin-top:14px; font-size:21px; line-height:1.45; color:rgba(255,255,255,.75); max-width:440px }
</style></head><body></body>
<script type="module">
const s = JSON.parse(new URLSearchParams(location.search).get('spec'))
const D = { phone: '--r:72px;--p:22px', tablet: '--r:56px;--p:30px', wide: '--r:64px;--p:34px' }[s.dev]
const BIG = '--k:80px;--h:100px'
const FLAT = 'border-top-left-radius:0;border-top-right-radius:0'
const cap = (style, cls = '') => `<div class="cap ${cls}" style="${style}"><div class="kick">${s.kick}</div><h1>${s.head}</h1></div>`
// height: show only the top of the screen (a device running off the canvas).
const dev = (style, height, src = s.shot) => IOS ? iosDev(style, height, src) : `<div class="dev" style="${D};${style}"><div class="scr"${height ? ` style="height:${height}px"` : ''}><img src="${src}"></div></div>`
// iPhone 6.9" / iPad 13" / iPhone Duo inner display: status bar, Dynamic Island, home indicator, side buttons. Widths in points, bezel included.
const IOS = { iphone: 460, ipad: 1088, duo: 693 }[s.dev]
const ICONS = '<span class="ic">'
  + '<svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>'
  + '<svg viewBox="0 0 16 12"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.3-1.4A10.6 10.6 0 0 0 8 .7 10.6 10.6 0 0 0 .7 3.6L2 5c1.6-1.5 3.7-2.4 6-2.4Zm0 3.7c1.3 0 2.5.5 3.4 1.3l1.3-1.4A6.8 6.8 0 0 0 8 4.4c-1.8 0-3.4.7-4.7 1.8L4.6 7.6A4.9 4.9 0 0 1 8 6.3Zm0 3.7c.4 0 .8.1 1.1.4L8 11.7 6.9 10.4c.3-.3.7-.4 1.1-.4Z"/></svg>'
  + '<svg viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4a2 2 0 0 0 0-4Z" opacity=".4"/></svg>'
  + '</span>'
const BUTTONS = {
  iphone: (u) => `<div class="btn" style="left:${u(-4)};top:${u(150)};width:${u(4)};height:${u(32)}"></div>`
    + `<div class="btn" style="left:${u(-4)};top:${u(205)};width:${u(4)};height:${u(60)}"></div>`
    + `<div class="btn" style="left:${u(-4)};top:${u(280)};width:${u(4)};height:${u(60)}"></div>`
    + `<div class="btn" style="right:${u(-4)};top:${u(225)};width:${u(4)};height:${u(95)}"></div>`,
  ipad: (u) => `<div class="btn" style="right:${u(80)};top:${u(-4)};width:${u(60)};height:${u(4)}"></div>`
    + `<div class="btn" style="right:${u(-4)};top:${u(110)};width:${u(4)};height:${u(55)}"></div>`
    + `<div class="btn" style="right:${u(-4)};top:${u(175)};width:${u(4)};height:${u(55)}"></div>`
    + `<div class="cam" style="right:${u(10.5)};top:50%"></div>`,
  duo: (u) => `<div class="btn" style="right:${u(-4)};top:${u(150)};width:${u(4)};height:${u(70)}"></div>`
    + `<div class="btn" style="right:${u(-4)};top:${u(240)};width:${u(4)};height:${u(100)}"></div>`,
}
function iosDev(style, height, src) {
  const u = (n) => `calc(var(--U) * ${n})`
  // Duo shots come from the simulator, with the real status bar and home indicator.
  const bar = s.dev === 'duo' ? '' : s.dev === 'iphone' ? `<div class="sbar"><span>9:41</span><span></span>${ICONS}</div><div class="island"></div>`
    : `<div class="sbar"><span>9:41&ensp;Mon Oct 19</span><span></span>${ICONS}</div>`
  // height is a cap: a shorter capture shows whole (the home indicator is hidden below if it's cut off).
  return `<div class="dev ios ${s.dev}" style="${style}"><div class="scr"${height ? ` style="max-height:${height}px"` : ''}><img src="${src}">${bar}${s.dev === 'duo' ? '' : '<div class="home"></div>'}</div>${BUTTONS[s.dev](u)}</div>`
}
const call = (style, src = s.shot, crop = s.crop) =>
  `<div class="call" data-crop="${crop}" style="${style};aspect-ratio:${crop[2]}/${crop[3]}"><img src="${src}"></div>`
// A standalone UI card: one of spec.cards, {name: [screenshot, crop]}.
const card = (name, style) => call(style, ...s.cards[name])
const paper = () => (document.body.className = 'paper', '')
// Extra canvas height over the 1920 these were drawn for (iOS canvases differ); 0 on Android.
const X = innerHeight - 1920

const layouts = {
  // Phone, 1080x1920
  top: () => cap('top:120px') + dev('left:130px;top:520px;width:820px'),
  bottom: () => dev(`left:130px;top:-80px;width:820px;${FLAT}`, 1300 + X) + cap(`top:${1450 + X}px`),
  tiltcall: () => cap('top:110px') + dev('left:220px;top:560px;width:760px;transform:rotate(7deg)') + call(`left:40px;top:${1080 + X * 0.6}px;width:820px;transform:rotate(-3deg)`),
  paper: () => paper() + cap('top:120px;right:300px', 'left') + dev(`left:520px;top:${640 + X * 0.4}px;width:700px;transform:rotate(-6deg)`) + call(`left:50px;top:${820 + X * 0.5}px;width:760px`),
  split: () => dev('left:70px;top:120px;width:740px;transform:rotate(-5deg)', 1160 + X) + call(`left:300px;top:${1080 + X}px;width:740px;transform:rotate(2deg)`) + cap(`top:${1500 + X}px;right:120px`, 'left'),
  // 7-inch tablet, 1080x1920
  'p-top': () => cap('top:110px') + dev('left:110px;top:470px;width:860px'),
  'p-bottom': () => dev(`left:110px;top:-30px;width:860px;${FLAT}`, 1240 + X) + cap(`top:${1440 + X}px`),
  'p-tiltcall': () => cap('top:110px') + dev('left:200px;top:540px;width:800px;transform:rotate(6deg)') + call(`left:40px;top:${1120 + X * 0.6}px;width:860px;transform:rotate(-3deg)`),
  'p-paper': () => paper() + cap('top:120px;right:260px', 'left') + dev(`left:380px;top:${620 + X * 0.15}px;width:780px;transform:rotate(-6deg)`) + call(`left:50px;top:${900 + X * 0.3}px;width:800px`),
  'p-split': () => dev('left:80px;top:110px;width:780px;transform:rotate(-4deg)', 1180 + X) + call(`left:280px;top:${1060 + X}px;width:760px;transform:rotate(2deg)`) + cap(`top:${1490 + X}px;right:120px`, 'left'),
  // 10-inch tablet, 2560x1440
  'l-left': () => cap(`left:150px;right:auto;top:470px;width:760px;${BIG}`, 'left') + dev('left:1000px;top:170px;width:1700px'),
  'l-right': () => dev('left:-160px;top:200px;width:1700px') + cap(`left:1680px;right:auto;top:480px;width:760px;${BIG}`, 'left'),
  'l-top': () => cap(`left:300px;right:300px;top:110px;${BIG}`) + dev('left:260px;top:440px;width:1700px') + call('left:1180px;top:820px;width:1300px;transform:rotate(-2.5deg)'),
  'l-paper': () => paper() + cap(`left:150px;right:auto;top:200px;width:820px;${BIG}`, 'left') + dev('left:1060px;top:240px;width:1600px;transform:rotate(-5deg)') + call('left:150px;top:820px;width:1100px;transform:rotate(1.5deg)'),
  // App Store Creative Assets, drawn at 2x. Product page header 1920x823 (3840x1646): Apple keeps
  // only a centered 823x330 safe on every device, so the caption sits there with real UI cards
  // around it. Search result card 1920x1280 (3840x2560): the centered 1084x515 safe area is x 418-1502,
  // y 382-897; the caption sits up and left of it by choice, so check it in App Store Connect's Preview.
  // Every card stays whole inside the canvas.
  header: () => card('book', 'left:40px;top:60px;width:500px;transform:rotate(-3deg)')
    + card('quote', 'left:50px;top:400px;width:480px;transform:rotate(2deg)')
    + card('chart', 'left:1380px;top:50px;width:500px;transform:rotate(3deg)')
    + card('services', 'left:1390px;top:440px;width:490px;transform:rotate(-2deg)')
    + `<div class="cap" style="left:560px;right:560px;top:262px;--k:48px;--h:62px"><div class="kick">${s.kick}</div><h1>${s.head}</h1></div>`,
  search: () => `<div class="cap left" style="left:260px;right:auto;top:250px;width:760px;--k:58px;--h:100px"><div class="kick">${s.kick}</div><h1>${s.head}</h1></div>`
    + card('quote', 'left:200px;top:680px;width:720px;transform:rotate(-1.5deg)')
    + card('days', 'left:1130px;top:70px;width:700px;transform:rotate(2deg)')
    + card('book', 'left:1120px;top:830px;width:730px;transform:rotate(-2deg)'),
  // The same two placements with the services CrossPoint Sync syncs to (spec.logos: [{src, name}]).
  'header-logos': () => {
    const at = [[90, 70], [330, 150], [130, 330], [380, 420], [110, 590], [1450, 90], [1700, 170], [1480, 400], [1720, 520]]
    const S = 104
    const lines = at.map(([x, y]) => [x + S / 2, y + S / 2]).map(([x, y]) => {
      const tx = x < 960 ? 600 : 1320
      return `<path d="M${x} ${y} Q ${(x + tx) / 2} ${(y + 411) / 2 + (y < 411 ? -60 : 60)} ${tx} 411" />`
    }).join('')
    return `<svg class="lines" viewBox="0 0 1920 823" fill="none" stroke="rgba(179,207,194,.28)" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round">${lines}</svg>`
      + s.logos.map((l, i) => `<div class="logo" style="--s:${S}px;left:${at[i][0]}px;top:${at[i][1]}px"><img src="${l.src}">${l.name}</div>`).join('')
      + `<div class="cap" style="left:560px;right:560px;top:262px;--k:48px;--h:62px"><div class="kick">${s.kick}</div><h1>${s.head}</h1></div>`
  },
  'search-logos': () => `<div class="cap left" style="left:440px;right:auto;top:420px;width:580px;--k:52px;--h:70px"><div class="kick">${s.kick}</div><h1>${s.head}</h1></div>`
    + s.logos.map((l, i) => `<div class="logo" style="--s:150px;left:${1060 + (i % 3) * 270}px;top:${235 + Math.floor(i / 3) * 290}px"><img src="${l.src}">${l.name}</div>`).join(''),
  // Feature graphic, 1024x500
  feature: () => `<div class="feature"><img src="${s.icon}"><div class="kick" style="--k:40px;margin-top:22px;transform-origin:left">${s.kick}</div>
    <h1 style="--h:64px;line-height:1.05;margin-top:0">${s.head}</h1><p>Progress, highlights and reading stats from your CrossPoint e-reader, on your phone.</p></div>`
    + dev('left:654px;top:56px;width:300px;transform:rotate(6deg);--r:38px;--p:12px'),
}
document.body.innerHTML = layouts[s.layout]()
for (const d of document.querySelectorAll('.ios')) d.style.setProperty('--u', `${d.offsetWidth / IOS}px`)

await document.fonts.ready
await Promise.all([...document.images].map((i) => i.decode()))
for (const scr of document.querySelectorAll('.ios .scr')) if (scr.clientHeight < scr.firstChild.clientHeight) scr.querySelector('.home')?.remove()
// Position each callout's screenshot so only its crop shows, enlarged to the callout's width.
for (const box of document.querySelectorAll('.call')) {
  const [x, y, w] = box.dataset.crop.split(',').map(Number), img = box.firstChild, k = box.clientWidth / w
  Object.assign(img.style, { width: `${img.naturalWidth * k}px`, left: `${-x * k}px`, top: `${-y * k}px` })
}
document.body.dataset.ready = '1'
</script></html>
