<!doctype html>
<html lang="en" class="antialiased" style="background:#fafaf9">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf9" />
    <title>CrossPoint Sync</title>
    <meta name="description" content="Your e-reader's library, highlights and reading stats on your phone and the web, synced from CrossPoint, CrossInk and KOReader." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CrossPoint Sync" />
    <meta property="og:title" content="CrossPoint Sync" />
    <meta property="og:description" content="Your e-reader's library, highlights and reading stats on your phone and the web, synced from CrossPoint, CrossInk and KOReader." />
    <meta property="og:image" content="https://sync.crosspointreader.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://sync.crosspointreader.com/og.jpg" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <!-- Installable from the web (Add to Home Screen) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CrossPoint" />
    <script>
      // Apply the saved appearance before first paint (theme.js takes over after).
      try {
        var pref = localStorage.getItem('crosspoint-theme') || 'system'
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.style.background = '#121110'
          document.querySelector('meta[name=theme-color]').setAttribute('content', '#121110')
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-stone-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
